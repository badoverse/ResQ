<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResQ</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66;
    --line: #dddad3; --me: #1f5f8b; --me-text: #ffffff; --ai: #ffffff;
    --accent: #1f5f8b; --warn-bg: #fff4d6; --warn-text: #6b4e00; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151513; --panel: #1f1f1c; --text: #ecebe7; --muted: #a3a29c;
      --line: #34332f; --me: #2f77a8; --me-text: #ffffff; --ai: #23231f;
      --accent: #6fb3e0; --warn-bg: #3a3017; --warn-text: #f3dc9b; --danger: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0 auto 0 0; letter-spacing: .02em; }
  select, button, textarea { font: inherit; color: inherit; }
  select, button {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; min-height: 40px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { color: var(--accent); font-size: 15px; }
  .banner {
    background: var(--warn-bg); color: var(--warn-text);
    padding: 8px 16px; font-size: 15px; border-bottom: 1px solid var(--line);
  }
  .banner b { color: inherit; }
  #log { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg { padding: 10px 14px; border-radius: 14px; max-width: 92%; white-space: normal; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-text); border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.err { align-self: stretch; color: var(--danger); border: 1px solid var(--danger); background: transparent; }
  .msg img { max-width: 220px; max-height: 220px; border-radius: 8px; display: block; margin-top: 6px; }
  .msg pre { background: rgba(127,127,127,.15); padding: 8px; border-radius: 6px; overflow-x: auto; }
  .msg code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; }
  .msg p { margin: .3em 0; } .msg ul, .msg ol { margin: .3em 0; padding-left: 1.4em; }
  details.think { color: var(--muted); font-size: 14px; margin-bottom: 6px; }
  details.think summary { cursor: pointer; }
  .empty { color: var(--muted); text-align: center; margin-top: 10vh; }
  .empty p { margin: .4em 0; }
  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px; }
  footer .wrap { flex-direction: row; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; resize: none; min-height: 48px; max-height: 40vh; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  #attachInfo { font-size: 14px; color: var(--muted); max-width: 820px; margin: 0 auto 6px; display: none; }
  #status { font-size: 14px; color: var(--muted); }
  header { position: relative; }
  .menu-btn { display: inline-flex; align-items: center; gap: 8px; border-color: var(--danger); color: var(--danger); font-weight: 600; }
  .menu-btn .icon { font-size: 20px; line-height: 1; }
  .cards {
    position: absolute; top: calc(100% + 4px); left: 16px; z-index: 20;
    display: flex; flex-direction: column; gap: 2px; padding: 6px;
    width: min(320px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  .cards span { font-size: 13px; color: var(--muted); padding: 4px 8px 6px; }
  .cards button { text-align: left; border: 0; border-radius: 6px; min-height: 44px; padding: 8px 10px; color: var(--danger); background: transparent; }
  .cards button:hover, .cards button:focus-visible { background: rgba(179,38,30,.1); outline: none; }
  .msg.card { align-self: stretch; max-width: 100%; background: var(--ai); border: 2px solid var(--danger); }
  .msg.card h3 { margin: 0 0 6px; font-size: 18px; color: var(--danger); }
  .msg.card ol { margin: 0; padding-left: 1.4em; } .msg.card li { margin: .25em 0; }
  .msg.card .src { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="menu-btn" aria-haspopup="true" aria-expanded="false" aria-controls="cards"><span class="icon" aria-hidden="true">&#9776;</span><span data-t="cardsBtn">Emergenze</span></button>
  <nav class="cards hidden" id="cards" aria-label="Schede di emergenza"></nav>
  <h1>ResQ</h1>
  <label><span data-t="model">Modello</span>
    <select id="model" aria-label="Modello"></select>
  </label>
  <button id="newChat" data-t="new">Nuova chat</button>
  <button id="lang" title="Lingua / Language">EN</button>
</header>
<div class="banner hidden" id="smallNote"></div>
<div class="banner">
  <span data-t="warn"><b>Emergenza? Chiama il 112.</b> L'AI può sbagliare: per salute e sicurezza controlla sempre le guide ufficiali.</span>
  <span class="links" id="books"></span>
</div>
<main id="log"><div class="wrap" id="msgs">
  <div class="empty" id="empty">
    <p data-t="hello1">Ciao, sono ResQ. Scrivi una domanda qui sotto e premi Invio.</p>
    <p data-t="hello2">Funziona senza internet. Niente di quello che scrivi lascia questo computer.</p>
    <p id="status"></p>
    <p data-t="guides"></p>
  </div>
</div></main>
<footer>
  <div id="attachInfo"></div>
  <div class="wrap">
    <button id="attach" title="Immagine" class="hidden" data-t="image">Immagine</button>
    <input id="file" type="file" accept="image/*" class="hidden">
    <textarea id="input" rows="1" placeholder="Scrivi un messaggio..."></textarea>
    <button id="send" class="primary" data-t="send">Invia</button>
    <button id="stop" class="hidden" data-t="stop">Ferma</button>
  </div>
</footer>
<script>
const API = 'http://127.0.0.1:11435';
// resq:7b gives the best emergency answers but needs ~8 GB RAM. Chrome/Edge report RAM (capped at 8).
const DEFAULT_MODEL = (navigator.deviceMemory || 0) >= 8 ? 'resq:7b' : 'resq:3b';
const T = {
  it: {
    cardsBtn: 'Emergenze',
    model: 'Modello', new: 'Nuova chat', image: 'Immagine', send: 'Invia', stop: 'Ferma',
    warn: "<b>Emergenza? Chiama il 112.</b> L'AI può sbagliare: per salute e sicurezza controlla sempre le guide ufficiali.",
    library: 'Biblioteca offline:', guides: 'Guide Protezione Civile e scheda emergenza: cartella <b>guide</b> sulla chiavetta.',
    fileMode: 'Questa pagina va aperta con start-ai (start-ai.bat su Windows, start-ai.command su Mac), non con doppio clic.',
    hello1: 'Ciao, sono ResQ. Scrivi una domanda qui sotto e premi Invio.',
    hello2: 'Funziona senza internet. Niente di quello che scrivi lascia questo computer.',
    placeholder: 'Scrivi un messaggio...', thinking: 'Ragionamento', loading: 'Sto caricando il modello (la prima volta può volerci un minuto)...',
    noServer: "ResQ non risponde. Chiudi questa pagina e riavvia start-ai dalla chiavetta.",
    noModels: 'Nessun modello trovato sulla chiavetta.', attached: 'Immagine allegata:', remove: 'rimuovi',
    stopped: '[fermato]', ready: 'Pronto.',
    small: 'Modello piccolo: va bene per domande semplici, ma per le emergenze usa resq:3b o resq:7b.',
  },
  en: {
    cardsBtn: 'Emergencies',
    model: 'Model', new: 'New chat', image: 'Image', send: 'Send', stop: 'Stop',
    warn: '<b>Emergency? Call 112.</b> The AI can be wrong: for health and safety always check the official guides.',
    library: 'Offline library:', guides: 'Civil protection guides and emergency sheet: <b>guide</b> folder on the stick.',
    fileMode: 'Open this page with start-ai (start-ai.bat on Windows, start-ai.command on Mac), not by double-clicking.',
    hello1: "Hi, I'm ResQ. Type a question below and press Enter.",
    hello2: 'Works without internet. Nothing you type leaves this computer.',
    placeholder: 'Type a message...', thinking: 'Reasoning', loading: 'Loading the model (the first time can take a minute)...',
    noServer: 'ResQ is not responding. Close this page and start start-ai again from the stick.',
    noModels: 'No models found on the stick.', attached: 'Image attached:', remove: 'remove',
    stopped: '[stopped]', ready: 'Ready.',
    small: 'Small model: fine for simple questions, but for emergencies use resq:3b or resq:7b.',
  }
};
const $ = id => document.getElementById(id);
let lang = 'it';
try { lang = localStorage.getItem('lang') || 'it'; } catch (e) {}
let history = [];
let caps = {};            // model -> capabilities array
let pendingImage = null;  // base64 without prefix
let pendingImageURL = '';
let controller = null;

function t(k) { return T[lang][k]; }
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
  $('input').placeholder = t('placeholder');
  $('lang').textContent = lang === 'it' ? 'EN' : 'IT';
}
$('lang').onclick = () => {
  lang = lang === 'it' ? 'en' : 'it';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
  renderCards();
  loadBooks();
  if ($('model').value) onModel();
};

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Small, safe markdown: escape first, then code blocks, inline code, bold, lists, paragraphs.
function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```[a-zA-Z0-9]*\n?([\s\S]*?)(```|$)/g, (_, code) => {
    blocks.push('<pre><code>' + code + '</code></pre>'); return '\u0000' + (blocks.length - 1) + '\u0000';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  const out = []; let list = null;
  for (const line of s.split('\n')) {
    const ul = line.match(/^\s*[-*•]\s+(.*)/), ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    const kind = ul ? 'ul' : ol ? 'ol' : null;
    if (kind) {
      if (list !== kind) { if (list) out.push('</' + list + '>'); out.push('<' + kind + '>'); list = kind; }
      out.push('<li>' + (ul || ol)[1] + '</li>');
    } else {
      if (list) { out.push('</' + list + '>'); list = null; }
      const h = line.match(/^#{1,6}\s+(.*)/);
      if (h) out.push('<p><b>' + h[1] + '</b></p>');
      else if (line.trim()) out.push('<p>' + line + '</p>');
    }
  }
  if (list) out.push('</' + list + '>');
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

function addMsg(role, html) {
  $('empty').classList.add('hidden');
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerHTML = html;
  $('msgs').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

async function loadModels() {
  const sel = $('model');
  try {
    const r = await fetch(API + '/api/tags');
    const data = await r.json();
    const names = (data.models || []).map(m => m.name).sort();
    if (!names.length) { $('status').textContent = t('noModels'); return; }
    sel.innerHTML = names.map(n => '<option>' + esc(n) + '</option>').join('');
    let saved = null; try { saved = localStorage.getItem('model'); } catch (e) {}
    sel.value = names.includes(saved) ? saved : (names.includes(DEFAULT_MODEL) ? DEFAULT_MODEL : names[0]);
    await Promise.all(names.map(async n => {
      try {
        const s = await (await fetch(API + '/api/show', { method: 'POST', body: JSON.stringify({ model: n }) })).json();
        caps[n] = s.capabilities || [];
      } catch (e) { caps[n] = []; }
    }));
    onModel();
    $('status').textContent = t('ready');
  } catch (e) {
    $('status').textContent = t('noServer');
  }
}
function onModel() {
  const m = $('model').value;
  try { localStorage.setItem('model', m); } catch (e) {}
  $('attach').classList.toggle('hidden', !(caps[m] || []).includes('vision'));
  const note = $('smallNote');
  note.textContent = /:1\.5b$/.test(m) ? t('small') : '';
  note.classList.toggle('hidden', !note.textContent);
  if (!(caps[m] || []).includes('vision')) clearImage();
}
$('model').onchange = onModel;

$('attach').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    pendingImageURL = String(rd.result);
    pendingImage = pendingImageURL.split(',')[1];
    $('attachInfo').style.display = 'block';
    $('attachInfo').innerHTML = esc(t('attached') + ' ' + f.name) + ' — <a href="#" id="rmImg">' + t('remove') + '</a>';
    $('rmImg').onclick = e => { e.preventDefault(); clearImage(); };
  };
  rd.readAsDataURL(f);
};
function clearImage() { pendingImage = null; pendingImageURL = ''; $('file').value = ''; $('attachInfo').style.display = 'none'; }

$('newChat').onclick = () => {
  if (controller) controller.abort();
  history = []; clearImage();
  $('msgs').querySelectorAll('.msg').forEach(n => n.remove());
  $('empty').classList.remove('hidden');
};

const input = $('input');
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = input.scrollHeight + 'px'; });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('send').onclick = send;
$('stop').onclick = () => controller && controller.abort();

function busy(on) {
  $('send').classList.toggle('hidden', on);
  $('stop').classList.toggle('hidden', !on);
  $('model').disabled = on;
}

async function send() {
  const text = input.value.trim();
  if ((!text && !pendingImage) || controller) return;
  const model = $('model').value;
  const userMsg = { role: 'user', content: text };
  let html = esc(text).replace(/\n/g, '<br>');
  if (pendingImage) { userMsg.images = [pendingImage]; html += '<img alt="" src="' + pendingImageURL + '">'; }
  addMsg('me', html);
  history.push(userMsg);
  input.value = ''; input.style.height = 'auto'; clearImage();

  const box = addMsg('ai', '<span style="color:var(--muted)">' + esc(t('loading')) + '</span>');
  const thinks = (caps[model] || []).includes('thinking');
  // ResQ's instructions and emergency playbook are built into the resq models (modelfiles/system-prompt.txt).
  const body = { model, stream: true, messages: history };
  if (thinks) body.think = true;

  controller = new AbortController(); busy(true);
  let answer = '', thought = '';
  const render = () => {
    box.innerHTML = (thought ? '<details class="think"><summary>' + esc(t('thinking')) + '</summary>' + md(thought) + '</details>' : '') + md(answer);
    $('log').scrollTop = $('log').scrollHeight;
  };
  try {
    const r = await fetch(API + '/api/chat', { method: 'POST', body: JSON.stringify(body), signal: controller.signal });
    if (!r.ok) throw new Error((await r.text()) || r.status);
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        if (j.message) { answer += j.message.content || ''; thought += j.message.thinking || ''; }
      }
      render();
    }
    history.push({ role: 'assistant', content: answer });
  } catch (e) {
    if (e.name === 'AbortError') { answer += '\n\n' + t('stopped'); render(); history.push({ role: 'assistant', content: answer }); }
    else { box.remove(); history.pop(); addMsg('err', esc(String(e.message || e))); if (String(e).includes('fetch')) addMsg('err', esc(t('noServer'))); }
  } finally {
    controller = null; busy(false); input.focus();
  }
}

async function loadBooks() {
  try {
    const xml = new DOMParser().parseFromString(await (await fetch('/catalog/v2/entries?count=50')).text(), 'application/xml');
    const items = [...xml.getElementsByTagName('entry')].map(e => {
      const link = [...e.getElementsByTagName('link')].find(l => l.getAttribute('type') === 'text/html');
      return link && { title: e.getElementsByTagName('title')[0].textContent, href: link.getAttribute('href') };
    }).filter(Boolean);
    if (items.length) $('books').innerHTML = '<span>' + t('library') + '</span>' +
      items.map(b => '<a target="_blank" rel="noopener" href="' + esc(b.href) + '">' + esc(b.title) + '</a>').join('');
  } catch (e) {}
}

// Emergency cards: fixed, checked instructions shown instantly, with no AI involved.
const CARDS = {
  it: { label: 'Schede di emergenza (senza AI):', src: "Scheda fissa, non generata dall'AI. Chiama il 112 se puoi.", cards: [
    ['Emorragia', ['Chiama il 112 o fai chiamare qualcuno, se possibile.', 'Premi subito forte sulla ferita con un panno pulito (o con la mano). Se il panno si inzuppa, non toglierlo: aggiungine un altro sopra.', 'Continua a premere senza fermarti.', 'Se il sangue esce a fiotti da un braccio o da una gamba e premere non basta: metti un laccio (cintura, cinghia, striscia di stoffa) 5-7 cm sopra la ferita e stringi finché il sangue si ferma.', "Annota l'ora del laccio. Non allentarlo mai: lo toglieranno i medici.", 'Tieni la persona sdraiata, al caldo, e parlale.']],
    ['Non respira', ['Chiama il 112 e metti il vivavoce. Se non risponde, riprova mentre aiuti.', 'Metti la persona a pancia in su su una superficie dura.', 'Massaggio cardiaco SUBITO: mani una sopra l\'altra al centro del petto, braccia tese, spingi giù 5-6 cm, 100-120 volte al minuto (ritmo di "Stayin\' Alive").', 'Non fermarti. Se sai farlo: 2 respiri ogni 30 compressioni. Se non sai farlo: solo compressioni continue.', 'Se c\'è un defibrillatore (DAE): accendilo e segui la voce.', 'Continua finché arrivano i soccorsi o la persona si riprende. In due, datevi il cambio ogni 2 minuti.']],
    ['Svenuto ma respira', ['Chiama il 112.', 'Mettila sul fianco (posizione laterale di sicurezza), testa leggermente all\'indietro.', 'Controlla che continui a respirare. Se smette: scheda "Non respira".']],
    ['Soffocamento', ['Se non riesce a respirare né a parlare: piegala in avanti e dai 5 colpi forti tra le scapole con il palmo.', 'Poi 5 compressioni addominali (Heimlich): da dietro, pugno sopra l\'ombelico, tira forte verso di te e verso l\'alto.', 'Ripeti 5 colpi e 5 compressioni finché l\'oggetto esce.', 'Se perde conoscenza: chiama il 112 e passa alla scheda "Non respira".']],
    ['Ustione', ['Acqua fresca corrente sulla ustione per 20 minuti.', 'Togli anelli, orologi e vestiti non attaccati alla pelle.', 'Copri con pellicola trasparente o un panno pulito. Niente ghiaccio, olio, burro o creme.', 'Chiama il 112 se è grande, sul viso o sulle mani, o se è un bambino.']],
    ['Bombardamento', ['Vai subito nel riparo più vicino: rifugio pubblico, metropolitana, parcheggio sotterraneo, cantina.', 'Se non c\'è: stanza interna senza finestre al piano più basso, con almeno due muri tra te e l\'esterno (corridoio o bagno).', 'Stai lontano da finestre e vetri. Sdraiati a terra e proteggi la testa.', 'Porta il kit: acqua, medicine, torcia, radio a batterie, power bank, documenti, scarpe chiuse, vestiti caldi.', 'Resta al riparo finché le autorità non dicono che è finito. Ascolta la radio.', 'Dopo: non toccare oggetti sconosciuti o ordigni inesplosi. Chiudi il gas se senti odore. Evita edifici danneggiati e cavi a terra.']],
    ['Terremoto', ['Durante: riparati sotto un tavolo robusto o vicino a un muro portante, lontano da finestre e mobili alti.', 'Non usare ascensori. Non precipitarti sulle scale.', 'Dopo: esci con prudenza, con le scarpe. Chiudi gas e corrente se puoi.', 'Vai in uno spazio aperto, lontano da edifici, alberi e cavi.', 'Segui le indicazioni della Protezione Civile e del Comune.']],
    ['Incendio', ['Esci subito e chiama il 115 o il 112.', 'Chiudi le porte dietro di te. Stai basso, sotto il fumo.', 'Prima di aprire una porta, toccala col dorso della mano: se è calda, non aprirla.', 'Non usare l\'ascensore.', 'Se il fuoco prende i vestiti: fermati, buttati a terra, rotola.']],
    ['Alluvione', ['Sali ai piani alti. Non scendere in cantina o nei garage.', 'Non usare l\'auto e non attraversare acqua che scorre: bastano 30 cm per trascinare un\'auto.', 'Stacca la corrente solo se puoi farlo all\'asciutto.', 'Bevi solo acqua in bottiglia o bollita.']],
    ['Allarme nucleare o chimico', ['Nucleare: entra in un edificio solido, vai al centro o in cantina, lontano da porte e finestre. Resta dentro almeno 24 ore, salvo diverse indicazioni.', 'Se eri fuori: togli i vestiti esterni, chiudili in un sacchetto, lavati con acqua e sapone.', 'Non prendere iodio se le autorità non lo dicono.', 'Chimico: entra, chiudi porte e finestre, spegni ventilazione e condizionatori, sali a un piano alto, sigilla le fessure con nastro e panni bagnati.', 'Ascolta la radio e segui le autorità.']]
  ]},
  en: { label: 'Emergency cards (no AI):', src: 'Fixed card, not generated by the AI. Call 112 if you can.', cards: [
    ['Bleeding', ['Call 112 or have someone call, if possible.', 'Press hard on the wound right away with a clean cloth (or your hand). If it soaks through, leave it and add another on top.', 'Keep pressing without stopping.', 'If blood spurts from an arm or leg and pressure is not enough: tie a tourniquet (belt, strap, strip of cloth) 5-7 cm above the wound and tighten until the bleeding stops.', 'Note the time. Never loosen it: doctors will remove it.', 'Keep the person lying down, warm, and talk to them.']],

};
function renderCards() {
  const c = CARDS[lang];
  $('cards').innerHTML = '<span>' + esc(c.label) + '</span>' +
    c.cards.map((card, i) => '<button data-card="' + i + '">' + esc(card[0]) + '</button>').join('');
  $('cards').querySelectorAll('button').forEach(b => b.onclick = () => {
    const [title, steps] = CARDS[lang].cards[+b.dataset.card];
    toggleMenu(false);
    addMsg('card', '<h3>' + esc(title) + '</h3><ol>' + steps.map(x => '<li>' + esc(x) + '</li>').join('') +
      '</ol><div class="src">' + esc(CARDS[lang].src) + '</div>');
  });
}
function toggleMenu(open) {
  $('cards').classList.toggle('hidden', !open);
  $('menuBtn').setAttribute('aria-expanded', String(open));
  if (open) { const first = $('cards').querySelector('button'); if (first) first.focus(); }
}
$('menuBtn').onclick = e => { e.stopPropagation(); toggleMenu($('cards').classList.contains('hidden')); };
document.addEventListener('click', e => { if (!$('cards').contains(e.target)) toggleMenu(false); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('cards').classList.contains('hidden')) { toggleMenu(false); $('menuBtn').focus(); }
});

applyLang();
renderCards();
if (location.protocol === 'file:') {
  $('status').textContent = t('fileMode');
} else {
  loadModels();
  loadBooks();
}
input.focus();
</script>
</body>
</html>
